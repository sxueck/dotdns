# Example dotdns configuration.
# Copy to /etc/dotdns/dotdns.toml or pass via `dotdns serve --config <path>`.

[server]
# Addresses to bind the DoT listener. Use both entries to serve IPv4 and IPv6.
binds = ["0.0.0.0:853", "[::]:853"]
# Idle timeout for TLS connections.
idle_timeout = "60s"

[tls]
# TLS certificate and private key are required for DoT serving.
cert_path = "/etc/dotdns/cert.pem"
key_path = "/etc/dotdns/key.pem"

[bootstrap]
# Global plain DNS servers used to resolve DoT/DoH upstream hostnames at startup.
# When empty, dotdns uses the system resolver.
dns = ["1.1.1.1:53", "1.0.0.1:53"]

# Upstream resolvers are tried in order until one succeeds.
[[upstreams]]
name = "cloudflare-dot"
address = "cloudflare-dns.com:853"
protocol = "dot"

[[upstreams]]
name = "cloudflare-doh"
address = "https://cloudflare-dns.com/dns-query"
protocol = "doh"

[[upstreams]]
name = "google-plain"
address = "8.8.8.8:53"
protocol = "plain"

[cache]
capacity = 10000
# Clamp response TTLs between min and max.
min_ttl = "5s"
max_ttl = "1h"

[edns]
enabled = true
preserve_client = true

[edns.client_subnet]
# Disabled by default for privacy. Enable to send client-derived ECS upstream.
enabled = false
ipv4_prefix = 24
ipv6_prefix = 56
exclude_private = true

[blocklist]
enabled = true
paths = [
    # "/etc/dotdns/blocklists/adguard-dns.txt",
]
urls = [
    # "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt",
]
allowlist_paths = [
    # "/etc/dotdns/blocklists/allowlist.txt",
]
allowlist_urls = [
    # "https://example.com/dotdns-allowlist.txt",
]
download_dir = "/var/lib/dotdns/blocklists"
refresh_interval = "6h"
download_timeout = "30s"
# null_ip returns 0.0.0.0 / :: for A/AAAA to avoid DNS retry storms.
# no_data returns NOERROR with empty answers and SOA negative caching.
# nx_domain returns NXDOMAIN with SOA negative caching.
response_mode = "null_ip"
blocked_ttl = "5m"

[management]
# Local-only management. Use Unix socket by default.
type = "unix"
path = "/run/dotdns/dotdns.sock"

# TCP loopback fallback (commented out to show syntax).
# type = "tcp"
# bind = "127.0.0.1:9953"

# Path to the persistent stats file. Cumulative counters are saved here
# every 60 seconds and on graceful shutdown so they survive restarts.
# stats_path = "/var/lib/dotdns/stats.json"

[logging]
level = "info"
format = "pretty"
